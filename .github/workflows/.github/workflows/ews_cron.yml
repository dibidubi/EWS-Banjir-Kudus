name: EWS Flood Warning Automation

on:
  schedule:
    # 00:00 UTC = Jam 07:00 WIB
    - cron: '0 0 * * *'
  workflow_dispatch: # Mengizinkan tombol 'Run workflow' untuk tes manual

jobs:
  run-ews-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute EWS Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: python main.py
